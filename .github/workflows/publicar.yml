name: Publicar versión

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [version.py]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer versión
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Crear el ejecutable
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconsole --onefile --clean --name ControlDeCostos --icon makan.ico --add-data "web;web" app.py
          (Get-FileHash dist\ControlDeCostos.exe -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii -NoNewline dist\ControlDeCostos.exe.sha256

      - name: Crear el instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss

      - name: Publicar el Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release create $tag --target main --title $tag --notes "Descarga **Instalar_ControlDeCostos.exe** para instalar la app en Windows." dist\Instalar_ControlDeCostos.exe dist\ControlDeCostos.exe dist\ControlDeCostos.exe.sha256
